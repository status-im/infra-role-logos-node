---
- name: Create storage directories
  file:
    dest: '{{ item }}'
    state: directory
    owner: '{{ logos_node_host_uid }}'
    group: '{{ logos_node_host_uid }}'
    mode: 0775
    recurse: yes
  with_items:
    - '{{ logos_node_storage_content_dir }}'
    - '{{ logos_node_cont_vol }}/data'

- name: Create mix-pool.json for RS nodes
  template:
    src: mix-pool.json.j2
    dest: '{{ logos_node_conf_path }}/mix-pool.json'
    owner: '{{ logos_node_host_uid }}'
    group: '{{ logos_node_host_uid }}'
    mode: 0644
  when: logos_node_storage_role == 'rs' and logos_node_storage_mix_pool_relays | default([]) | length > 0

- name: Write storage private key file
  register: logos_node_storage_config
  shell: |
    set -eu
    umask 077
    dest='{{ logos_node_conf_path }}/storage_key'
    tmp=$(mktemp '{{ logos_node_conf_path }}/.storage_key.XXXXXX')
    trap 'rm -f "$tmp"' EXIT
    xxd -r -p > "$tmp"
    if cmp -s "$tmp" "$dest"; then
      echo UNCHANGED
    else
      cat "$tmp" > "$dest"
      echo CHANGED
    fi
    chown {{ logos_node_host_uid }}:{{ logos_node_host_uid }} "$dest"
    chmod 0600 "$dest"
  args:
    executable: /bin/bash
    stdin: '{{ logos_node_storage_key | mandatory }}'
  changed_when: "'CHANGED' in logos_node_storage_config.stdout.split()"
  no_log: true
