---
- name: Create blockchain data directories
  file:
    dest: '{{ item }}'
    state: directory
    owner: '{{ logos_node_host_uid }}'
    group: '{{ logos_node_host_uid }}'
    mode: 0775
  with_items:
    - '{{ logos_node_cont_vol }}/data'
    - '{{ logos_node_cont_vol }}/state'

- name: Create blockchain config file
  register: logos_node_blockchain_config
  template:
    src: '{{ item.src }}'
    dest: '{{ logos_node_conf_path }}/{{ item.dest }}'
    owner: '{{ logos_node_host_uid }}'
    group: '{{ logos_node_host_uid }}'
    mode: '{{ item.mode }}'
  with_items:
    - { src: 'blockchain_config.yml.j2', dest: 'node_config.yaml', mode: '0600' }
    - { src: 'otel-config.yml.j2',       dest: 'otel-config.yml',  mode: '0644' }
  no_log: true

