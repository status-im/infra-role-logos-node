---
- name: Check logos_node_delivery_store_db_url for $ sign
  assert:
    that: "{{ not logos_node_delivery_store_db_url | regex_search('\\$') }}"
    fail_msg: "Do not use $ (dollar) sign in passwords: {{ logos_node_delivery_store_db_url }}"
    quiet: true
  when: logos_node_delivery_store_db_url != ''

- name: Create delivery config file
  register: logos_node_delivery_config
  template:
    src: waku_config.json.j2
    dest: '{{ logos_node_conf_path }}/waku_config.json'
    owner: '{{ logos_node_host_uid }}'
    group: '{{ logos_node_host_uid }}'
    mode: 0644

- name: Create libp2p config file
  register: logos_node_delivery_libp2p_config
  template:
    src: libp2p_config.json.j2
    dest: '{{ logos_node_conf_path }}/libp2p_config.json'
    owner: '{{ logos_node_host_uid }}'
    group: '{{ logos_node_host_uid }}'
    mode: 0644
  when: logos_node_delivery_plugin_kad_discovery | bool

- name: Check RLN settings
  assert:
    that:
      - logos_node_delivery_rln_registry_id != ''
      - logos_node_delivery_rln_epoch_size_sec | int > 0
      - logos_node_delivery_rln_sequencer_url != ''
    fail_msg: 'RLN needs registry id, epoch size and sequencer URL'
    quiet: true
  when: logos_node_delivery_rln_enabled | bool

- name: Create RLN presets file
  register: logos_node_delivery_rln_config
  template:
    src: rln_presets.json.j2
    dest: '{{ logos_node_conf_path }}/rln_presets.json'
    owner: '{{ logos_node_host_uid }}'
    group: '{{ logos_node_host_uid }}'
    mode: 0644
  when: logos_node_delivery_rln_enabled | bool
