---
# Container
logos_node_cont_tag: 'latest'
logos_node_cont_image: 'docker.io/logosco/logos-node:{{ logos_node_cont_tag }}'
logos_node_cont_name: 'logos-node'
logos_node_cont_vol: '/docker/{{ logos_node_cont_name }}'
logos_node_conf_path: '{{ logos_node_cont_vol }}/conf'

logos_node_cont_uid: 10000
logos_node_userns_base: 100000
logos_node_host_uid: '{{ logos_node_userns_base + logos_node_cont_uid }}'
logos_node_watchtower_enabled: false

# Logging
logos_node_log_level: 'DEBUG'

# Network
logos_node_host: '0.0.0.0'
logos_node_public_address: '{{ ansible_host }}'

# Modules
logos_node_base_modules: ['openmetrics']
logos_node_modules: ['delivery_module']
logos_node_module_calls:
  - 'delivery_module createNode @/conf/waku_config.json'
  - 'delivery_module start'

# Module flags
logos_node_delivery_enabled: '{{ "delivery_module" in logos_node_modules }}'
logos_node_storage_enabled: '{{ "storage_module" in logos_node_modules }}'
logos_node_blockchain_enabled: '{{ "blockchain_module" in logos_node_modules }}'

# Metrics
logos_node_metrics_enabled: true
logos_node_metrics_port: 8008
logos_node_metrics_text_modules: ['delivery_module']

# --- Delivery module ---

#logos_node_delivery_key: ''
#logos_node_delivery_mix_key: ''

logos_node_delivery_cluster_id: 2
logos_node_delivery_num_shards_in_network: 8
logos_node_delivery_dns4_domain_name: '{{ ansible_hostname }}'

logos_node_delivery_protocols_available: ['relay', 'store', 'filter', 'lightpush', 'mix']
logos_node_delivery_protocols_enabled: ['relay']
logos_node_delivery_discv5: false
logos_node_delivery_kad_discovery: false

logos_node_delivery_max_connections: 150
logos_node_delivery_max_pure_libp2p_peers: 0

logos_node_delivery_p2p_tcp_port: 30303
logos_node_delivery_p2p_udp_port: 30303
logos_node_delivery_discv5_udp_port: 9000
logos_node_delivery_websocket_port: 8000

logos_node_delivery_websocket_enabled: false
logos_node_delivery_websocket_secure_enabled: false
logos_node_delivery_websocket_ssl_dir: '/etc/letsencrypt'
logos_node_delivery_websocket_domain: '{{ logos_node_delivery_dns4_domain_name }}'

logos_node_delivery_store_db_url: ''
logos_node_delivery_store_retention_policy: 'size:1GB'

logos_node_delivery_kad_bootstrap_nodes: []
# Run Kademlia in libp2p_module (own port and key) instead of in-process.
# Bootstrap nodes must then be other nodes' libp2p_module addresses.
logos_node_delivery_kad_discovery_plugin_enabled: false
logos_node_delivery_kad_discovery_plugin_p2p_tcp_port: 30304
# Mandatory when enabled. Keep it in vault, per host: 08021220 + 32 random hex bytes.
#logos_node_libp2p_key: ~

# RLN
logos_node_delivery_rln_enabled: false
logos_node_delivery_rln_validation_enabled: false
logos_node_delivery_rln_registry_id: ''
logos_node_delivery_rln_epoch_size_sec: 0
logos_node_delivery_rln_sequencer_url: ''

# --- Storage module ---

logos_node_storage_tcp_port: 8080
logos_node_storage_nat: 'extip:{{ logos_node_public_address }}'

logos_node_storage_role: 'mp'
logos_node_storage_no_bootstrap: false
logos_node_storage_dht_mix_proxy: []
logos_node_storage_mix_pool_relays: []

logos_node_storage_api_enabled: false
logos_node_storage_api_bindaddr: '127.0.0.1'
logos_node_storage_api_port: 8091

logos_node_storage_data_dir: '/data'
logos_node_storage_preload_content: []

#logos_node_storage_key: ''

logos_node_storage_bootstrap_nodes: []

logos_node_storage_content_dir: '{{ logos_node_cont_vol }}/content'

# --- Blockchain module ---

logos_node_blockchain_deployment: 'devnet'

logos_node_blockchain_swarm_port: 3000
logos_node_blockchain_blend_port: 3400
logos_node_blockchain_api_port: 8080

logos_node_blockchain_peer_response_timeout: 30000

logos_node_blockchain_initial_peers: []

logos_node_blockchain_db_dir: './db'
logos_node_blockchain_state_dir: './state'

#logos_node_blockchain_node_key: ''
#logos_node_blockchain_blend_signing_key: ''
#logos_node_blockchain_blend_zk_key: ''
#logos_node_blockchain_funding_pk: ''
#logos_node_blockchain_voucher_master_key: ''

# OTEL collector
logos_otel_cont_name: 'logos-otel-collector'
logos_otel_version: '0.80.0'
logos_otel_cont_image: 'otel/opentelemetry-collector-contrib:{{ logos_otel_version }}'
logos_otel_exposed_port: 8888
logos_otel_exporter_port: 8889
logos_otel_rpc_receiver_port: 4317
logos_otel_http_receiver_port: 4318
logos_otel_healthcheck_port: 13133

# --- Resource limits ---
logos_node_cpu_limit: '{{ ansible_processor_cores - 0.3 }}'
logos_node_mem_limit: '{{ (ansible_memtotal_mb * 0.85) | int }}'

# --- Consul ---
logos_node_consul_service_name: 'logos-node'
logos_node_consul_check_interval: '60s'
logos_node_consul_check_timeout: '5s'
logos_node_consul_success_before_passing: 0
logos_node_consul_failures_before_warning: 1
logos_node_consul_failures_before_critical: 2

# --- Container monitor ---
logos_node_monitor_enabled: true
logos_node_monitor_meta_fields: ['image', 'commit', 'version']
logos_node_monitor_docker_events: ['stop', 'start', 'restart', 'die', 'kill']
logos_node_monitor_service_name: 'monitor-{{ logos_node_cont_name }}'
logos_node_monitor_service_user: 'root'
logos_node_monitor_service_work_dir: '/etc/consul'
logos_node_monitor_script: '{{ logos_node_cont_vol }}/monitor.sh'

# --- Compose ---
compose_recreate: 'auto'
compose_state: 'present'
compose_pull: 'always'
